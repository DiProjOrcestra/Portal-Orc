version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal_orc_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: portal_orc_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portal_orc
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
    depends_on:
      - postgres

volumes:
  pgdata:
