version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal_orc_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: portal_orc_backend
    ports:
      - "8080:8080" 
    env_file:
      - .env
