spring:
  application:
    name: portal_orc
  
  datasource: 
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portal_orc}
    username: ${DB_USERNAME:portal_orc}
    password: ${DB_PASSWORD:orcestra}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format-sql: true
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          localhost: localhost

  
